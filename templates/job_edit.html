{% extends 'base.html' %}{% block content %}<link rel="stylesheet" href="{{url_for('static',filename='jobs.css')}}">
<nav class="job-breadcrumbs"><a class="button secondary" href="{{url_for('job_detail',job_id=job[0])}}">‹ Back</a><strong>{{job[1]}}</strong></nav>
<section class="panel edit-record-panel"><div class="panel-head"><div><span class="section-kicker">{{job[24]}} · {{job[25]}}</span><h2>Edit Job</h2></div></div><form method="post" class="job-form edit-record-form">
<label>Job ID<input value="{{job[1]}}" readonly></label><label>Job title *<input name="job_title" value="{{job[2]}}" required></label><label>Job type *<input name="job_type" value="{{job[3]}}" required></label><label>Status<select name="status">{% for value in ['Draft','Planned','In Progress','Awaiting Review','Completed','Cancelled'] %}<option {{'selected' if job[4]==value}}>{{value}}</option>{% endfor %}</select></label><label>Calibration method *<select name="method_id" required>{% for m in methods %}<option value="{{m[0]}}" {{'selected' if job[5]==m[0]}}>{{m[1]}} · Rev {{m[2]}}</option>{% endfor %}</select></label><label>Registered MUT<select name="equipment_id"><option value="">Not linked</option>{% for e in equipment_rows %}<option value="{{e[0]}}" {{'selected' if job[6]==e[0]}}>{{e[2]}} · {{e[1]}}</option>{% endfor %}</select></label>
<label>MUT description *<input name="mut_description" value="{{job[7]}}" required></label><label>Asset ID<input name="mut_asset_id" value="{{job[8]}}"></label><label>Serial number<input name="mut_serial_number" value="{{job[9]}}"></label><label>Manufacturer<input name="manufacturer" value="{{job[10]}}"></label><label>Model<input name="model_number" value="{{job[11]}}"></label><label>Meter type *<input name="meter_type" value="{{job[12]}}" required></label><label>Meter size<input name="meter_size" value="{{job[13]}}"></label><label>Minimum range *<input type="number" step="any" name="flow_min" value="{{job[14]}}" required></label><label>Maximum range *<input type="number" step="any" name="flow_max" value="{{job[15]}}" required></label><label>Unit *<input name="flow_unit" value="{{job[16]}}" required></label><label>Number of flow points *<input type="number" min="1" max="50" name="flow_point_count" value="{{job[17]}}" required></label><label>Fluid / medium *<input name="fluid_medium" value="{{job[18]}}" required></label><label>Calibration quantity *<select name="calibration_quantity"><option value="mass" {{'selected' if job[19]=='mass'}}>Mass flow</option><option value="volume" {{'selected' if job[19]=='volume'}}>Volume flow</option></select></label><label>Planned start<input type="date" name="planned_start_date" value="{{job[20] or ''}}"></label><label>Due date *<input type="date" name="required_date" value="{{job[21] or ''}}" required></label><label>Revised Job PO<input name="job_purchase_order" value="{{job[22]}}"></label><label class="wide">Notes<textarea name="notes" rows="3">{{job[23]}}</textarea></label><div class="form-actions wide"><button class="action-button">Save Changes</button><a class="button secondary" href="{{url_for('job_detail',job_id=job[0])}}">Cancel</a></div></form></section>{% endblock %}
