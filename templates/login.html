<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In · FlowLab Pro</title><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='responsive.css')}}"></head><body><main class="login-shell"><section class="panel login-panel"><div class="brand-name">FlowLab Pro</div>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post" class="login-form"><label>Username *<input name="username" autocomplete="username" required></label><label>Password *<input type="password" name="password" autocomplete="current-password" required></label><button>Sign In</button></form>{% if needs_setup %}<a class="panel-link" href="{{url_for('setup')}}">Create initial administrator</a>{% endif %}</section></main></body></html>
