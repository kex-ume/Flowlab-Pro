{% extends 'base.html' %}{% block content %}<section class="module-intro"><div><span class="eyebrow">{{eyebrow}}</span><h1>{{page_title}}</h1><p>{{description}}</p></div><span class="module-count">{{modules|length}} modules</span></section><section class="module-grid">{% for module in modules %}<a class="module-card" href="{{module.url}}"><span class="module-icon">{{module.icon}}</span><span><b>{{module.title}}</b><small>{{module.description}}</small><em>{{module.action}} →</em></span></a>{% endfor %}</section>{% endblock %}
