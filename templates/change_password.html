<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create New Password · FlowLab Pro</title>
  <link rel="stylesheet" href="{{url_for('static',filename='app.css')}}">
  <link rel="stylesheet" href="{{url_for('static',filename='responsive.css')}}">
</head>
<body>
  <main class="login-shell">
    <section class="login-visual" aria-label="Flow calibration laboratory"></section>
    <section class="login-access"><div class="login-panel">
      <div class="login-form-head"><span class="eyebrow">Secure account</span><h2>Create new password</h2><p>Your temporary password was accepted. Create a private password before continuing.</p></div>
      {% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}
      <form method="post" class="login-form"><label>New password<input type="password" name="password" minlength="10" autocomplete="new-password" required></label><label>Confirm new password<input type="password" name="password_confirmation" minlength="10" autocomplete="new-password" required></label><button>Create new password</button></form>
      <div class="login-security"><span aria-hidden="true">✓</span> Minimum 10 characters</div>
    </div></section>
  </main>
</body>
</html>
