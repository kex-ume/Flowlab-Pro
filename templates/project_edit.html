{% extends 'base.html' %}{% block content %}<link rel="stylesheet" href="{{url_for('static',filename='jobs.css')}}">
<nav class="job-breadcrumbs"><a class="button secondary" href="{{url_for('project_jobs',project=project[0])}}">‹ Back</a><strong>{{project[1]}}</strong></nav>
<section class="panel edit-record-panel"><div class="panel-head"><div><span class="section-kicker">Controlled project record</span><h2>Edit Project</h2></div></div>
<form method="post" class="job-form edit-record-form"><label>Project ID<input value="{{project[1]}}" readonly></label><label>Project name *<input name="project_name" value="{{project[2]}}" required></label><label>Client *<input name="project_client_name" list="clientOptions" value="{{project[4]}}" required></label><datalist id="clientOptions">{% for c in customers %}<option value="{{c[1]}}"></option>{% endfor %}</datalist><label>Project PO<input name="project_purchase_order" value="{{project[5]}}"></label><label>Project manager<input name="project_manager" value="{{project[6]}}"></label><label>Start date<input type="date" name="project_start_date" value="{{project[7] or ''}}"></label><label>Expected completion<input type="date" name="project_completion_date" value="{{project[8] or ''}}"></label><label>Status<select name="project_status">{% for value in ['Draft','Planned','In Progress','Completed','Closed'] %}<option {{'selected' if project[9]==value}}>{{value}}</option>{% endfor %}</select></label><label class="wide">Description<textarea name="project_description" rows="3">{{project[10]}}</textarea></label><label class="wide">Notes<textarea name="project_notes" rows="3">{{project[11]}}</textarea></label><div class="form-actions wide"><button class="action-button">Save Changes</button><a class="button secondary" href="{{url_for('project_jobs',project=project[0])}}">Cancel</a></div></form></section>{% endblock %}
