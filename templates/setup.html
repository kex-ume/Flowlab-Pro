<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initial Setup · FlowLab Pro</title><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='responsive.css')}}"></head><body><main class="login-shell"><section class="panel login-panel"><div class="brand-name">FlowLab Pro</div>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post" class="login-form"><label>Username *<input name="username" autocomplete="username" required></label><label>Full name *<input name="full_name" autocomplete="name" required></label><label>Password *<input type="password" name="password" minlength="10" autocomplete="new-password" required></label><label>Confirm password *<input type="password" name="password_confirmation" minlength="10" autocomplete="new-password" required></label><button>Create Administrator</button></form></section></main></body></html>
