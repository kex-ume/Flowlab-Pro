<form class="ei-action-form ei-new-job-grid" action="{% url 'ei_personnel_action' person.pk 'evidence' %}">{% csrf_token %}<input type="hidden" name="previous" value="{{ previous }}">
<div><label>Category</label><select name="kind"><option value="qualification" {% if kind == 'qualification' %}selected{% endif %}>Qualification</option><option value="training" {% if kind == 'training' %}selected{% endif %}>Training</option><option value="experience" {% if kind == 'experience' %}selected{% endif %}>Experience</option><option value="impartiality" {% if kind == 'impartiality' %}selected{% endif %}>Impartiality assessment</option><option value="confidentiality" {% if kind == 'confidentiality' %}selected{% endif %}>Confidentiality acknowledgement</option><option value="job_description" {% if kind == 'job_description' %}selected{% endif %}>Job description</option><option value="lab_role" {% if kind == 'lab_role' %}selected{% endif %}>Lab role</option><option value="authorization_memo" {% if kind == 'authorization_memo' %}selected{% endif %}>Authorization letter</option><option value="supporting" {% if kind == 'supporting' %}selected{% endif %}>Supporting document</option></select></div><div><label>Title</label><input name="title" required></div><div><label>Issuer</label><input name="issuer"></div><div><label>Record date</label><input type="date" name="date"></div><div><label>Expiry (only where applicable)</label><input type="date" name="expires"></div><div><label>Details / revision reason</label><textarea name="history"></textarea></div><div><label>Supporting file</label><input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.xlsx,.docx" required></div><button class="ei-records-primary">Submit for Verification</button><p class="ei-form-message" role="status"></p></form>
